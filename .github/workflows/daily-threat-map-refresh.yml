name: Daily Threat Map Refresh

on:
  schedule:
    # AbuseIPDB resets at 00:00 UTC. 00:30 UTC is 01:30 BST.
    - cron: "30 0 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  refresh-threat-map:
    name: Refresh Daily Top 50 and Warm Intelligence
    runs-on: ubuntu-latest
    steps:
      - name: Refresh cached Daily Top 50 snapshot
        env:
          THREAT_MAP_BASE_URL: ${{ secrets.THREAT_MAP_BASE_URL }}
          THREAT_MAP_CRON_SECRET: ${{ secrets.THREAT_MAP_CRON_SECRET }}
        run: |
          set -euo pipefail
          base_url="${THREAT_MAP_BASE_URL:-https://www.dominic-boban.com}"
          base_url="${base_url%/}"
          refresh_url="${base_url}/api/scheduled/threat-map-refresh"
          echo "Calling scheduled threat map refresh endpoint: ${refresh_url}"

          if [ -z "${THREAT_MAP_CRON_SECRET:-}" ]; then
            echo "THREAT_MAP_CRON_SECRET is required in GitHub Actions secrets."
            exit 1
          fi

          post_scheduled_endpoint() {
            endpoint_url="$1"
            label="$2"
            response_file="$(mktemp)"

            http_status="$(
              curl --silent --show-error --location \
                --request POST \
                --output "${response_file}" \
                --write-out "%{http_code}" \
                --header "Authorization: Bearer ${THREAT_MAP_CRON_SECRET}" \
                --header "Accept: application/json" \
                --header "Content-Type: application/json" \
                --header "User-Agent: dominic-boban-threat-map-cron/1.0" \
                --data '{"source":"github-actions","workflow":"daily-threat-map-refresh"}' \
                "${endpoint_url}"
            )"

            response="$(cat "${response_file}")"
            rm -f "${response_file}"

            echo "${response}"

            if [ "${http_status}" -lt 200 ] || [ "${http_status}" -ge 300 ]; then
              echo "${label} failed with HTTP ${http_status}." >&2
              echo "Response preview:" >&2
              printf '%.1000s\n' "${response}" >&2
              exit 1
            fi

            RESPONSE_BODY="${response}" python3 -c "import json, os; json.loads(os.environ.get('RESPONSE_BODY', ''))" || {
              echo "Expected JSON from ${label}. Check endpoint routing, Cloudflare Access, WAF rules, or cron auth." >&2
              printf '%.1000s\n' "${response}" >&2
              exit 1
            }
          }

          post_scheduled_endpoint "${refresh_url}" "scheduled threat map refresh endpoint"

      - name: Warm VirusTotal queue
        env:
          THREAT_MAP_BASE_URL: ${{ secrets.THREAT_MAP_BASE_URL }}
          THREAT_MAP_CRON_SECRET: ${{ secrets.THREAT_MAP_CRON_SECRET }}
        run: |
          set -euo pipefail
          base_url="${THREAT_MAP_BASE_URL:-https://www.dominic-boban.com}"
          base_url="${base_url%/}"
          warmup_url="${base_url}/api/scheduled/threat-intel-warmup"
          echo "Calling scheduled threat intelligence warmup endpoint: ${warmup_url}"

          # Give the refresh endpoint's background queue writer a moment to persist.
          sleep 10

          post_scheduled_endpoint() {
            endpoint_url="$1"
            label="$2"
            response_file="$(mktemp)"

            http_status="$(
              curl --silent --show-error --location \
                --request POST \
                --output "${response_file}" \
                --write-out "%{http_code}" \
                --header "Authorization: Bearer ${THREAT_MAP_CRON_SECRET}" \
                --header "Accept: application/json" \
                --header "Content-Type: application/json" \
                --header "User-Agent: dominic-boban-threat-map-cron/1.0" \
                --data '{"source":"github-actions","workflow":"daily-threat-map-refresh"}' \
                "${endpoint_url}"
            )"

            response="$(cat "${response_file}")"
            rm -f "${response_file}"

            echo "${response}"

            if [ "${http_status}" -lt 200 ] || [ "${http_status}" -ge 300 ]; then
              echo "${label} failed with HTTP ${http_status}." >&2
              echo "Response preview:" >&2
              printf '%.1000s\n' "${response}" >&2
              exit 1
            fi

            RESPONSE_BODY="${response}" python3 -c "import json, os; json.loads(os.environ.get('RESPONSE_BODY', ''))" || {
              echo "Expected JSON from ${label}. Check endpoint routing, Cloudflare Access, WAF rules, or cron auth." >&2
              printf '%.1000s\n' "${response}" >&2
              exit 1
            }
          }

          for attempt in $(seq 1 15); do
            response="$(post_scheduled_endpoint "${warmup_url}" "scheduled threat intelligence warmup endpoint")"

            parsed="$(
              RESPONSE_BODY="${response}" python3 -c "import json, os; payload = json.loads(os.environ.get('RESPONSE_BODY', '')); print(payload.get('remaining', 0)); print(payload.get('status', ''))"
            )" || {
              echo "Expected JSON from the scheduled warmup endpoint. Check endpoint routing, Cloudflare Access, or cron auth." >&2
              printf '%.500s\n' "${response}" >&2
              exit 1
            }
            remaining="$(sed -n '1p' <<< "${parsed}")"
            status="$(sed -n '2p' <<< "${parsed}")"

            if [ "${remaining}" = "0" ] || [ "${status}" = "complete" ] || [ "${status}" = "empty" ] || [ "${status}" = "not_configured" ] || [ "${status}" = "unavailable" ] || [ "${status}" = "rate_limited" ]; then
              break
            fi

            if [ "${attempt}" != "15" ]; then
              sleep 60
            fi
          done
